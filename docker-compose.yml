# Servicio de turnos y reservas: su base y la aplicación (enunciado §3). Uno por servicio, sin Compose conjunto.
# Las credenciales se leen de .env (ver .env.example); nunca se escriben acá.
# Kafka y la API REST son los de la cátedra: no se levantan localmente (solo por ZeroTier).
#
#   docker compose up -d --build      base y aplicación (perfil prod)
#   docker compose up -d turnos-db    solo la base, para desarrollar con ./mvnw (perfil dev)
#   docker compose stop               apaga en orden; nunca "down -v": borra los datos
#
# El nombre del proyecto no se cambia: los datos están en el volumen turnos-service_turnos-db-data.
name: turnos-service
services:
  turnos-db:
    image: postgres:18.1-alpine
    container_name: turnos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TURNOS_DB_NAME:?Falta TURNOS_DB_NAME en .env}
      POSTGRES_USER: ${TURNOS_DB_USER:?Falta TURNOS_DB_USER en .env}
      POSTGRES_PASSWORD: ${TURNOS_DB_PASSWORD:?Falta TURNOS_DB_PASSWORD en .env}
    ports:
      # Solo localhost; el puerto del host es configurable para no chocar
      # con la base del servicio de catálogo (5433).
      - "127.0.0.1:${TURNOS_DB_PORT:-5434}:5432"
    volumes:
      # Desde PostgreSQL 18 la imagen guarda los datos bajo /var/lib/postgresql.
      - turnos-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  turnos-app:
    build: .
    image: turnos-service:local
    container_name: turnos-app
    # Si falta una variable obligatoria la aplicación no arranca: tres intentos y queda detenida, con el motivo en
    # el log (docker compose logs turnos-app). Docker no la reinicia después de un docker compose stop.
    restart: on-failure:3
    # Las mismas variables que usa ./mvnw. "raw": los valores llegan literales, como los lee Spring
    # (sin raw, Compose interpreta "$" y quita comillas).
    env_file:
      - path: .env
        format: raw
    # Pisan a las del .env, que son para ./mvnw desde el host.
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # La base, por la red del Compose: el nombre del servicio y el puerto del contenedor (no el del host).
      TURNOS_DB_HOST: turnos-db
      TURNOS_DB_PORT: "5432"
      # El catálogo es otro Compose (o ./mvnw): se llega por el host. Su puerto tiene que estar publicado en la
      # IP del gateway de Docker (DOCKER_GATEWAY_IP en su .env); en 127.0.0.1 solo no se llega.
      CATALOGO_API_URL: http://host.docker.internal:8081
      # La misma zona que en desarrollo: los logs se leen igual que las evidencias anteriores.
      # El código no depende de la zona de la JVM (RESERVATION_TIME_ZONE).
      TZ: America/Argentina/Mendoza
      # Heap máximo; sin esto la JVM toma el 25 % de la RAM del host.
      JAVA_TOOL_OPTIONS: -Xmx512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 127.0.0.1 por defecto (el emulador de Android entra por 10.0.2.2). Para un teléfono físico, la IP de la
      # red local en TURNOS_APP_BIND. Nunca 0.0.0.0: también abriría el puerto en la red de ZeroTier.
      - "${TURNOS_APP_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      turnos-db:
        condition: service_healthy
    # Spring cierra por fases, hasta 30 s cada una (la reconciliación en curso, Kafka, los pedidos en vuelo).
    # Docker manda SIGKILL recién después de esto; el valor por defecto (10 s) lo cortaría a mitad de camino.
    stop_grace_period: 90s
    healthcheck:
      # La imagen no trae curl ni wget: el pedido va con bash. readiness incluye la base, no Kafka ni la cátedra.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /management/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s

volumes:
  turnos-db-data:
