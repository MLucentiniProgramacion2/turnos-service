# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

spring:
  application:
    name: turnosService
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: test
  jackson:
    datatype:
      datetime:
        write-durations-as-timestamps: false
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: turnos-service-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: turnos-service-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
  security:
    authentication:
      jwt:
        # Solo para tests: clave falsa, pública a propósito (es la jwtSecretKey de .yo-rc.json).
        # Nunca usarla en dev ni en prod; ahí la clave sale de JWT_BASE64_SECRET.
        base64-secret: dHVybm9zLXNlcnZpY2U6IGNsYXZlIEpXVCBTT0xPIFBBUkEgVEVTVFMuIE5vIHVzYXIgZW4gZGV2IG5pIGVuIHByb2QuIFB1YmxpY2EgYSBwcm9wb3NpdG8u
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 86400

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

application:
  liquibase:
    # Igual que en el application.yml principal, que este archivo tapa en los tests: Liquibase
    # termina antes de que Hibernate valide el esquema, sin depender del nombre del perfil.
    async-start: false

reservation:
  reconciliation:
    # Apagada por lo mismo que el listener: cada contexto reconciliaría contra una cátedra que no existe y escribiría
    # procesos. La prenden solo sus tests, o llaman al caso de uso directo.
    enabled: false

catedra:
  api:
    # Solo para tests: valores falsos. Nadie escucha en el puerto 1, así que ningún test de contexto
    # llega a la cátedra real; los tests del cliente usan un servidor simulado.
    url: http://localhost:1
    token: token-falso-solo-para-tests

  kafka:
    # Solo para tests: valores falsos, y el listener apagado para que cada contexto no se conecte a un
    # broker que no existe. Lo prenden solo los tests de Kafka, con un broker de Testcontainers.
    bootstrap-servers: localhost:1
    actions-topic: topic-de-acciones-de-test
    consumer-group: grupo-de-test
    phone-topic: topic-de-telefono-de-test
    group-id: group-id-de-test
    listener-enabled: false
    producer:
      # Apagada por lo mismo que el listener: cada contexto intentaría describir el topic en un broker que no existe.
      # La prenden solo sus tests.
      background-topic-check-enabled: false

catalogo:
  api:
    # Solo para tests: nadie escucha en el puerto 1. Los tests del cliente usan un servidor simulado.
    url: http://localhost:1
